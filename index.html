<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Khata</title>
<meta name="theme-color" content="#4f46e5"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e8eaf3;--pri:#5b5bd6;--gr:#10b981;--rd:#f43f5e;--am:#d97706;--sh:0 6px 22px rgba(30,41,90,.09);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e19;--card:#141a29;--tx:#e8ecf7;--mu:#8b95ad;--bd:#222a3d;--pri:#8b8bf5;--gr:#34d399;--rd:#fb7185;--am:#fbbf24;--sh:0 6px 22px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0e19;--card:#141a29;--tx:#e8ecf7;--mu:#8b95ad;--bd:#222a3d;--pri:#8b8bf5;--gr:#34d399;--rd:#fb7185;--am:#fbbf24;--sh:0 6px 22px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#4f46e5;z-index:60}
button{font:inherit;cursor:pointer;border:0;transition:transform .12s,opacity .12s}button:active{transform:scale(.95)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}.i.big{width:44px;height:44px;opacity:.4}
.g{color:var(--gr)}.r{color:var(--rd)}small{color:var(--mu);font-size:12px}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sl{from{transform:translateY(100%)}to{transform:none}}
#app>*{animation:up .3s both}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;padding:26px 18px 20px;border-radius:0 0 28px 28px;box-shadow:var(--sh)}
.hero small{color:rgba(255,255,255,.75)}.ht{font-size:15px;opacity:.9}
.nb{font-size:38px;font-weight:800;letter-spacing:-1px;margin:4px 0 12px}
.split{height:8px;border-radius:8px;background:rgba(244,63,94,.85);overflow:hidden;margin-bottom:14px}.split i{display:block;height:100%;background:#34d399;border-radius:8px;transition:width .6s}
.two,.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two>div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px)}.two b{display:block;font-size:17px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.g{background:#34d399}.dot.r{background:#fb7185}
.chips{display:flex;gap:8px;padding:16px 14px 6px;overflow-x:auto}
.chips button{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);color:var(--tx);font-size:13px;font-weight:600;box-shadow:var(--sh);display:flex;gap:6px;align-items:center}
.chips button.on{background:var(--pri);color:#fff}.chips em{font-style:normal;font-size:11px;opacity:.7}
.srch{display:flex;align-items:center;gap:8px;margin:8px 14px;background:var(--card);border-radius:14px;padding:0 6px 0 12px;box-shadow:var(--sh);color:var(--mu)}
.srch input{flex:1;border:0;background:none;color:var(--tx);padding:13px 4px;font:inherit;outline:0;min-width:0}
.ib{background:none;color:inherit;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
#sb{width:auto;border-radius:12px;padding:0 10px;gap:5px;display:flex;align-items:center;font-size:12px;font-weight:600;color:var(--pri);background:rgba(91,91,214,.1)}
.lst{margin:8px 14px;background:var(--card);border-radius:18px;box-shadow:var(--sh);overflow:hidden}
.lst>*{animation:up .35s both}
.row,.tl{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--bd);transition:background .15s}
.row:last-child,.tl:last-child{border:0}.row:active,.tl:active{background:var(--bg)}
.av{width:44px;height:44px;border-radius:16px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;flex:none}.av.lg{width:68px;height:68px;border-radius:24px;font-size:28px;margin:0 auto 8px}
.nm,.d{flex:1;min-width:0}.nm b,.d b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{text-align:right}.amt b{display:block}
.bd{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--bg);color:var(--mu)}.bd.r{background:rgba(244,63,94,.13);color:var(--rd)}.bd.am{background:rgba(245,158,11,.15);color:var(--am)}
.empty{text-align:center;color:var(--mu);padding:46px 24px;display:grid;gap:6px;justify-items:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:30px;padding:14px 24px;font-weight:700;display:flex;gap:8px;align-items:center;box-shadow:0 10px 26px rgba(79,70,229,.45);z-index:30}
.fab:active{transform:translateX(-50%) scale(.95)}
.nv{position:fixed;left:12px;right:12px;max-width:536px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-radius:22px;box-shadow:0 8px 30px rgba(20,30,70,.2);display:flex;padding:6px;z-index:35}
.nv button{flex:1;background:none;color:var(--mu);display:grid;justify-items:center;gap:2px;padding:7px;border-radius:16px;font-size:11px;font-weight:600}.nv button.on{color:var(--pri);background:rgba(91,91,214,.12)}
.tb{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg)}
.tb b{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{margin:4px 14px;background:var(--card);border-radius:22px;box-shadow:var(--sh);padding:18px;text-align:center}
.pc h2{margin:0;font-size:19px}.pb{font-size:34px;font-weight:800;letter-spacing:-1px;margin-top:8px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 12px;border-radius:12px;background:var(--bg);color:var(--mu);margin:2px 4px 10px 0}.pill.g{background:rgba(16,185,129,.14)}.pill.r{background:rgba(244,63,94,.13)}
.two2>div{background:var(--bg);border-radius:14px;padding:10px}.two2 b{display:block}
.acts{display:flex;gap:6px;padding:14px;overflow-x:auto}
.acts button{flex:none;background:none;color:var(--tx);font-size:11px;font-weight:600;display:grid;justify-items:center;gap:6px;width:68px}
.acts button span{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--pri)}
.dt{padding:12px 16px 4px;font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;background:var(--card)}
.ti{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;background:rgba(244,63,94,.12);color:var(--rd)}.ti.g{background:rgba(16,185,129,.13);color:var(--gr)}
.bot{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;display:flex;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%);z-index:30}
.bot button{flex:1;padding:15px;border-radius:16px;color:#fff;font-weight:700;font-size:15px;display:flex;gap:8px;justify-content:center;align-items:center;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.gv{background:linear-gradient(135deg,#f43f5e,#e11d48)}.rc{background:linear-gradient(135deg,#10b981,#059669)}
.warn{margin:12px 14px 0;padding:10px 12px;border-radius:14px;background:rgba(245,158,11,.14);color:var(--am);font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}.warn.hot{background:rgba(244,63,94,.13);color:var(--rd)}.warn .i{width:18px;height:18px}
.mod{position:fixed;inset:0;background:rgba(10,14,30,.55);display:flex;align-items:flex-end;z-index:70;animation:up .2s both}
.sh{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:92vh;overflow-y:auto;animation:sl .28s cubic-bezier(.2,.9,.3,1)}
.hd{width:40px;height:4px;border-radius:4px;background:var(--bd);margin:0 auto 4px}.sh h3{margin:0}
input{width:100%;padding:13px 14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit}input:focus{outline:0;border-color:var(--pri)}
.b{display:flex;gap:8px}.b button{flex:1;padding:14px;border-radius:14px;font-weight:700;background:var(--bg);color:var(--tx)}
.b .ok{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}.b .no{background:rgba(244,63,94,.13);color:var(--rd)}.b .sq{flex:0 0 52px;display:grid;place-items:center}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px}.seg button{flex:1;padding:10px;border-radius:11px;background:none;color:var(--mu);font-weight:700;display:flex;gap:6px;justify-content:center;align-items:center}
.seg button.on{background:var(--card);box-shadow:var(--sh)}
.amtw{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--bd);padding:4px 0}.amtw span{font-size:30px;font-weight:700;color:var(--mu)}
.amtw input{border:0;background:none;font-size:34px;font-weight:800;padding:6px 0}
.qs,.dr{display:flex;gap:8px}.qs button,.dr button{flex:none;padding:9px 13px;border-radius:12px;background:var(--bg);color:var(--tx);font-size:13px;font-weight:600}.dr input{flex:1;min-width:0}
.li{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:10px 4px;background:none;color:var(--tx);font-size:15px}.li b{display:block;font-weight:600}
.ci{width:40px;height:40px;border-radius:13px;background:rgba(91,91,214,.12);color:var(--pri);display:grid;place-items:center;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:#1e2233;color:#fff;padding:11px 16px;border-radius:16px;font-size:14px;z-index:90;display:flex;gap:14px;align-items:center;animation:up .25s both;box-shadow:0 8px 24px rgba(0,0,0,.3)}.toast button{background:none;color:#a5b4fc;font-weight:700}
.lock{text-align:center;padding:90px 30px}.lock input{max-width:190px;text-align:center;font-size:28px;letter-spacing:12px;margin:12px auto}
.ph1{padding:18px 16px 6px}.ph1 h1{margin:0;font-size:24px}
.seg2{display:flex;gap:8px;padding:6px 14px}.seg2 button{flex:1;padding:9px;border-radius:12px;background:var(--card);color:var(--tx);font-weight:600;font-size:13px;box-shadow:var(--sh)}.seg2 button.on{background:var(--pri);color:#fff}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 14px}.st div{background:var(--card);border-radius:16px;padding:12px;box-shadow:var(--sh)}.st b{display:block;font-size:15px}
.cc{margin:8px 14px;background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--sh)}.cc text{fill:var(--mu);font-size:11px}.lg2{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:6px}
.sec{padding:14px 18px 2px;font-weight:700}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="12" cy="19" r="1.2"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.8 7L3 21l2-5.5A8 8 0 1 1 21 12z"/></symbol>
<symbol id="i-sms" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></symbol>
<symbol id="i-up" viewBox="0 0 24 24"><path d="M7 17L17 7M8 7h9v9"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="M17 7L7 17M16 17H7V8"/></symbol>
<symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5a5 5 0 0 1 4.5 5"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>

<symbol id="i-down2" viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 20V9M7 13l5-5 5 5M5 4h14"/></symbol>
<symbol id="i-hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></symbol>
<symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></symbol>
</defs></svg>
<div id="app"></div><div id="nav"></div><div id="mo"></div>
<script>
var K="khata_v1",KC="khata_cfg",D={parties:[],txns:[]},C={pin:"",theme:""},V={pg:"h",tab:"a",q:"",sort:"r",p:null,per:"m"},ok_=false,TK="gave";
try{var a0=localStorage.getItem(K);if(a0)D=JSON.parse(a0);a0=localStorage.getItem(KC);if(a0)C=JSON.parse(a0)}catch(e){}
const $=i=>document.getElementById(i);
function persist(){try{localStorage.setItem(K,JSON.stringify(D));return 1}catch(e){if(!persist.w){persist.w=1;alert("Could not save data. Storage may be full or blocked. Take a backup now.")}}}
function save(){if(persist()){C.since=(C.since||0)+1;saveC()}}
function saveC(){try{localStorage.setItem(KC,JSON.stringify(C))}catch(e){}}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=n=>"₹"+Math.abs(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function today(o){var d=new Date();d.setDate(d.getDate()-(o||0));return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
const fd=d=>new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const sd=d=>new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"});
const days=d=>Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);
function h(s){var x=5381;for(var i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return String(x)}
const ic=(n,c)=>`<svg class="i ${c||""}"><use href="#i-${n}"/></svg>`;
const vb=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};
function toast(m,l,f){var t=document.createElement("div");t.className="toast";t.innerHTML=`<span>${esc(m)}</span>`;if(l){var b=document.createElement("button");b.textContent=l;b.onclick=()=>{f();t.remove()};t.appendChild(b)}document.body.appendChild(t);setTimeout(()=>t.remove(),l?4500:2000)}
const GR=[["#6366f1","#8b5cf6"],["#0ea5e9","#6366f1"],["#10b981","#0ea5e9"],["#f59e0b","#ef4444"],["#ec4899","#8b5cf6"],["#14b8a6","#22c55e"]];
function av(n,c){var s=0;for(var i=0;i<n.length;i++)s+=n.charCodeAt(i);var g=GR[s%GR.length];return `<div class="av ${c||""}" style="background:linear-gradient(135deg,${g[0]},${g[1]})">${esc(n.charAt(0).toUpperCase())}</div>`}
const P=id=>D.parties.find(x=>x.id===id);
function bal(id){var b=0;D.txns.forEach(t=>{if(t.pid===id)b+=t.kind==="gave"?t.amt:-t.amt});return Math.round(b*100)/100}
function lastD(id){var m="";D.txns.forEach(t=>{if(t.pid===id&&t.date>m)m=t.date});return m}
function due(p,b){if(!p.due||b===0)return null;var d=days(p.due);return d<0?{t:"Overdue "+(-d)+"d",c:"r",s:1}:d<=3?{t:d?"Due in "+d+"d":"Due today",c:"am",s:1}:{t:"Due "+sd(p.due),c:"",s:0}}
function applyTheme(){var r=document.documentElement;C.theme?r.setAttribute("data-theme",C.theme):r.removeAttribute("data-theme")}
function M(x){$("mo").innerHTML=x?`<div class="mod" onclick="if(event.target===this)M()"><div class="sh"><i class="hd"></i>${x}</div></div>`:"";if(x)vb()}
function cu(el,to){if(!el)return;var t0=performance.now();(function f(t){var k=Math.min(1,(t-t0)/550),e=1-Math.pow(1-k,3);el.textContent=(to<0?"−":"")+money(to*e);if(k<1)requestAnimationFrame(f)})(t0)}
function nav(){$("nav").innerHTML=V.p?"":`<div class="nv"><button class="${V.pg==="h"?"on":""}" onclick="go('h')">${ic("people")}People</button><button class="${V.pg==="r"?"on":""}" onclick="go('r')">${ic("chart")}Reports</button><button onclick="menu()">${ic("more")}More</button></div>`}
function go(p){V.pg=p;V.p=null;render();window.scrollTo(0,0)}
function render(){applyTheme();if(C.pin&&!ok_){$("nav").innerHTML="";return lock()}V.p?person(V.p):V.pg==="r"?reports():home();nav()}
function lock(){$("app").innerHTML=`<div class="lock"><div class="ci" style="margin:0 auto;width:64px;height:64px;border-radius:22px">${ic("lock","big")}</div><h2>Enter PIN</h2><input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" oninput="chk(this)"><small id="pe"></small></div>`}
function chk(i){if(i.value.length===4){if(h(i.value)===C.pin){ok_=true;render()}else{i.value="";$("pe").textContent="Wrong PIN, try again";vb()}}}
const SORT={r:"Recent",a:"Amount",n:"A–Z"};
function cs(){V.sort=V.sort==="r"?"a":V.sort==="a"?"n":"r";sb();list()}
function sb(){$("sb").innerHTML=ic("sort")+SORT[V.sort]}
function home(){
  var g=0,v=0,c={a:D.parties.length,g:0,v:0,d:0};
  D.parties.forEach(p=>{var b=bal(p.id),d=due(p,b);if(b>0){g+=b;c.g++}else if(b<0){v-=b;c.v++}if(d&&d.s)c.d++});
  var n=g-v,t=g+v,pc=t?Math.round(g/t*100):50,T=[["a","All"],["g","To receive"],["v","To pay"],["d","Due"]];
  $("app").innerHTML=`<div class="hero"><small>Khata</small><div class="ht">Net balance</div><div class="nb" id="nb">${money(0)}</div><div class="split"><i style="width:${pc}%"></i></div><div class="two"><div><span class="dot g"></span><small>To receive</small><b>${money(g)}</b></div><div><span class="dot r"></span><small>To pay</small><b>${money(v)}</b></div></div></div>${bkBar()}
  <div class="chips">${T.map(x=>`<button class="${V.tab===x[0]?"on":""}" onclick="V.tab='${x[0]}';home()">${x[1]}<em>${c[x[0]]}</em></button>`).join("")}</div>
  <div class="srch">${ic("search")}<input id="q" type="search" placeholder="Search name or phone" value="${esc(V.q)}" oninput="V.q=this.value;list()"><button id="sb" onclick="cs()"></button></div><div id="list"></div>
  <button class="fab" onclick="editP()">${ic("plus")}New person</button><div style="height:150px"></div>`;
  cu($("nb"),n);list();sb()}
function list(){
  var q=V.q.toLowerCase(),l=D.parties.filter(p=>{var b=bal(p.id),d=due(p,b);return(p.name.toLowerCase().includes(q)||(p.phone||"").includes(q))&&(V.tab==="a"||(V.tab==="g"&&b>0)||(V.tab==="v"&&b<0)||(V.tab==="d"&&d&&d.s))});
  l.sort(V.sort==="n"?(a,c)=>a.name.localeCompare(c.name):V.sort==="a"?(a,c)=>Math.abs(bal(c.id))-Math.abs(bal(a.id)):(a,c)=>(lastD(c.id)||"0").localeCompare(lastD(a.id)||"0"));
  $("list").innerHTML=l.length?`<div class="lst">${l.map((p,i)=>{var b=bal(p.id),d=due(p,b),ld=lastD(p.id);return `<div class="row" style="animation-delay:${Math.min(i,8)*30}ms" onclick="openP('${p.id}')">${av(p.name)}<div class="nm"><b>${esc(p.name)}</b><small>${d?`<span class="bd ${d.c}">${d.t}</span>`:ld?"Last entry "+sd(ld):"No entries yet"}</small></div><div class="amt"><b class="${b>0?"g":b<0?"r":""}">${money(b)}</b><small>${b>0?"to receive":b<0?"to pay":"settled"}</small></div></div>`}).join("")}</div>`:`<div class="empty">${ic("people","big")}<b>${D.parties.length?"No matches":"No people yet"}</b><small>${D.parties.length?"Try another filter or search.":"Add your first person to start the ledger."}</small></div>`}
function openP(id){V.p=id;render();window.scrollTo(0,0)}
function back(){V.p=null;render()}
function person(id){
  var p=P(id);if(!p){V.p=null;return home()}
  var b=bal(id),d=due(p,b),run=0,tg=0,tr=0;
  var t=D.txns.filter(x=>x.pid===id).sort((a,c)=>a.date.localeCompare(c.date)||a.id.localeCompare(c.id)).map(x=>{if(x.kind==="gave"){run+=x.amt;tg+=x.amt}else{run-=x.amt;tr+=x.amt}return{x:x,r:run}}).reverse();
  var last="",rows=t.map(o=>{var x=o.x,hd=x.date!==last?`<div class="dt">${fd(x.date)}</div>`:"";last=x.date;
    return `${hd}<div class="tl" onclick="editT('${x.id}')"><span class="ti ${x.kind==="gave"?"r":"g"}">${ic(x.kind==="gave"?"up":"down")}</span><div class="d"><b>${x.note?esc(x.note):x.kind==="gave"?"Money given":"Money received"}</b><small>Balance ${o.r<0?"−":""}${money(o.r)}</small></div><b class="${x.kind==="gave"?"r":"g"}">${x.kind==="gave"?"−":"+"}${money(x.amt)}</b></div>`}).join("");
  var A=[];if(p.phone)A.push(["phone","Call",`location.href='tel:${esc(p.phone)}'`]);
  if(b!==0&&p.phone){A.push(["chat","WhatsApp",`remind('${id}',0)`]);A.push(["sms","SMS",`remind('${id}',1)`])}
  A.push(["doc","Statement",`report('${id}')`],["cal",p.due?sd(p.due):"Due date",`dueM('${id}')`]);if(b!==0)A.push(["check","Settle up",`settle('${id}')`]);
  $("app").innerHTML=`<div class="tb"><button class="ib" onclick="back()">${ic("back")}</button><b>${esc(p.name)}</b><button class="ib" onclick="pm('${id}')">${ic("more")}</button></div>
  <div class="pc">${av(p.name,"lg")}<h2>${esc(p.name)}</h2><small>${esc(p.phone||"No phone added")}</small><div class="pb ${b>0?"g":b<0?"r":""}">${money(b)}</div><span class="pill ${b>0?"g":b<0?"r":""}">${b>0?"To receive":b<0?"To pay":"All settled"}</span>${d?`<span class="bd ${d.c}">${d.t}</span>`:""}
  <div class="two2"><div><small>Total given</small><b class="r">${money(tg)}</b></div><div><small>Total received</small><b class="g">${money(tr)}</b></div></div></div>
  <div class="acts">${A.map(a=>`<button onclick="${a[2]}"><span>${ic(a[0])}</span>${a[1]}</button>`).join("")}</div>${bkBar()}
  ${t.length?`<div class="lst">${rows}</div>`:`<div class="empty">${ic("doc","big")}<b>No entries yet</b><small>Tap Gave or Received to add the first one.</small></div>`}
  <div style="height:100px"></div><div class="bot"><button class="gv" onclick="addT('gave')">${ic("up")}Gave</button><button class="rc" onclick="addT('got')">${ic("down")}Received</button></div>`}
function editP(id){var p=id?P(id):{name:"",phone:""};M(`<h3>${id?"Edit details":"New person"}</h3><input id="n" placeholder="Full name" value="${esc(p.name)}"><input id="ph" type="tel" inputmode="tel" placeholder="Phone number (optional)" value="${esc(p.phone)}"><div class="b"><button onclick="M()">Cancel</button><button class="ok" onclick="saveP('${id||""}')">${id?"Save changes":"Add person"}</button></div>`);if(!id)setTimeout(()=>$("n")&&$("n").focus(),80)}
function saveP(id){var n=$("n").value.trim();if(!n)return toast("Please enter a name");var ph=$("ph").value.trim();if(id){var p=P(id);p.name=n;p.phone=ph;save();M();render()}else{id=uid();D.parties.push({id:id,name:n,phone:ph});save();M();openP(id)}}
function pm(id){M(`<h3>${esc(P(id).name)}</h3>${mi("edit","Edit details","",`editP('${id}')`)}${mi("trash","Delete person","Removes all their entries",`delP('${id}')`)}`)}
function delP(id){if(confirm("Delete this person and all their entries?")){D.parties=D.parties.filter(p=>p.id!==id);D.txns=D.txns.filter(t=>t.pid!==id);save();M();back()}}
function addT(k){tm({kind:k,amt:"",note:"",date:today()})}
function editT(id){tm(D.txns.find(t=>t.id===id))}
function tm(x){var e=!!x.id;TK=x.kind;M(`<div class="seg"><button id="sg" class="${TK==="gave"?"on r":""}" onclick="sk('gave')">${ic("up")}Gave</button><button id="sr" class="${TK==="got"?"on g":""}" onclick="sk('got')">${ic("down")}Received</button></div>
  <div class="amtw"><span>₹</span><input id="a" type="number" inputmode="decimal" placeholder="0" value="${esc(x.amt)}"></div>
  <div class="qs">${[100,500,1000,5000].map(n=>`<button onclick="qa(${n})">+${n.toLocaleString("en-IN")}</button>`).join("")}</div>
  <input id="nt" placeholder="Add a note (item, bill no.)" value="${esc(x.note)}">
  <div class="dr"><input id="dt" type="date" value="${x.date}"><button onclick="$('dt').value=today()">Today</button><button onclick="$('dt').value=today(1)">Yesterday</button></div>
  <div class="b">${e?`<button class="no sq" onclick="delT('${x.id}')">${ic("trash")}</button>`:""}<button class="ok" onclick="saveT('${x.id||""}')">Save entry</button></div>`);
  if(!e)setTimeout(()=>$("a")&&$("a").focus(),80)}
function sk(k){TK=k;$("sg").className=k==="gave"?"on r":"";$("sr").className=k==="got"?"on g":"";vb()}
function qa(n){var a=$("a");a.value=(parseFloat(a.value)||0)+n;vb()}
function saveT(id){var a=parseFloat($("a").value);if(!(a>0))return toast("Enter an amount");var nt=$("nt").value.trim(),dt=$("dt").value||today();
  if(id){var x=D.txns.find(t=>t.id===id);x.amt=a;x.note=nt;x.date=dt;x.kind=TK}else D.txns.push({id:uid(),pid:V.p,kind:TK,amt:a,note:nt,date:dt});save();M();person(V.p);toast("Entry saved")}
function delT(id){var t=D.txns.find(x=>x.id===id);D.txns=D.txns.filter(x=>x.id!==id);save();M();person(V.p);toast("Entry deleted","Undo",()=>{D.txns.push(t);save();render()})}
function settle(id){var b=bal(id);if(!b||!confirm("Mark "+money(b)+" as settled?"))return;D.txns.push({id:uid(),pid:id,kind:b>0?"got":"gave",amt:Math.abs(b),note:"Settled",date:today()});save();person(id);toast("All settled")}
function dueM(id){var p=P(id);M(`<h3>Payment due date</h3><input id="dd" type="date" value="${p.due||""}"><div class="b"><button onclick="setDue('${id}',1)">Clear</button><button class="ok" onclick="setDue('${id}',0)">Save date</button></div>`)}
function setDue(id,c){P(id).due=c?"":$("dd").value;save();M();person(id)}
const ph=n=>{n=n.replace(/\D/g,"");return n.length===10?"91"+n:n};
function remind(id,s){var p=P(id),b=bal(id),m="Hello "+p.name+", "+(b>0?"a gentle reminder that "+money(b)+" is pending with you":"I will clear the pending "+money(b)+" soon")+(p.due&&b>0?" (due "+fd(p.due)+")":"")+". Thank you.";
  location.href=s?"sms:"+p.phone+"?body="+encodeURIComponent(m):"https://wa.me/"+ph(p.phone)+"?text="+encodeURIComponent(m)}
function report(id){var p=P(id),b=bal(id),t=D.txns.filter(x=>x.pid===id).sort((a,c)=>a.date.localeCompare(c.date));
  var m="Statement: "+p.name+"\n"+t.map(x=>fd(x.date)+"  "+(x.kind==="gave"?"Gave ":"Got ")+money(x.amt)+(x.note?" ("+x.note+")":"")).join("\n")+"\nBalance: "+money(b)+(b>0?" (to receive)":b<0?" (to pay)":" (settled)");
  if(navigator.share)navigator.share({text:m}).catch(()=>{});else location.href="https://wa.me/"+(p.phone?ph(p.phone):"")+"?text="+encodeURIComponent(m)}
function reports(){
  var now=new Date(),ms=[];for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push({k:d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2),l:d.toLocaleDateString("en-IN",{month:"short"}),g:0,r:0})}
  var lim=V.per==="m"?today().slice(0,7):V.per==="q"?ms[3].k:"",pg=0,pr=0;
  D.txns.forEach(t=>{var m=ms.find(x=>x.k===t.date.slice(0,7));if(m){if(t.kind==="gave")m.g+=t.amt;else m.r+=t.amt}if(!lim||t.date.slice(0,7)>=lim){if(t.kind==="gave")pg+=t.amt;else pr+=t.amt}});
  var mx=Math.max(1,...ms.map(m=>Math.max(m.g,m.r))),H=100,ch=ms.map((m,i)=>{var x=i*53+8,a=m.g/mx*H,b=m.r/mx*H;return `<rect x="${x}" y="${H-a+8}" width="18" height="${a}" rx="5" fill="var(--rd)"/><rect x="${x+21}" y="${H-b+8}" width="18" height="${b}" rx="5" fill="var(--gr)"/><text x="${x+20}" y="128" text-anchor="middle">${m.l}</text>`}).join("");
  var top=D.parties.map(p=>({p:p,b:bal(p.id)})).filter(o=>o.b>0).sort((a,c)=>c.b-a.b).slice(0,5),od=D.parties.filter(p=>{var d=due(p,bal(p.id));return d&&d.c==="r"});
  var mr=(p,b,s)=>`<div class="row" onclick="openP('${p.id}')">${av(p.name)}<div class="nm"><b>${esc(p.name)}</b><small>${s}</small></div><b class="g">${money(b)}</b></div>`;
  $("app").innerHTML=`<div class="ph1"><h1>Reports</h1></div><div class="seg2">${[["m","This month"],["q","3 months"],["a","All time"]].map(x=>`<button class="${V.per===x[0]?"on":""}" onclick="V.per='${x[0]}';reports()">${x[1]}</button>`).join("")}</div>
  <div class="st"><div><small>Given</small><b class="r">${money(pg)}</b></div><div><small>Received</small><b class="g">${money(pr)}</b></div><div><small>Net</small><b>${pr-pg<0?"−":""}${money(pr-pg)}</b></div></div>
  <div class="cc"><div class="lg2"><span><span class="dot r"></span>Given</span><span><span class="dot g"></span>Received</span><span>Last 6 months</span></div><svg viewBox="0 0 320 134" width="100%">${ch}</svg></div>
  <div class="sec">Top to receive</div>${top.length?`<div class="lst">${top.map(o=>mr(o.p,o.b,"Pending")).join("")}</div>`:`<div class="empty"><small>Nobody owes you right now.</small></div>`}
  <div class="sec">Overdue</div>${od.length?`<div class="lst">${od.map(p=>mr(p,bal(p.id),due(p,bal(p.id)).t)).join("")}</div>`:`<div class="empty"><small>No overdue payments.</small></div>`}<div style="height:110px"></div>`}
const mi=(i,l,s,f)=>`<button class="li" onclick="${f}"><span class="ci">${ic(i)}</span><span><b>${l}</b>${s?`<small>${s}</small>`:""}</span></button>`;
function menu(){M(`<h3>More</h3>${mi("upload","Back up now","Share a backup file (Telegram, WhatsApp, Files)","bk()")}${mi("down2","Save backup to Downloads",bkStat(),"exp()")}${mi("hist","Restore from backup file","Choose a saved .json file","$('f').click()")}${mi("hist","Restore points","Daily copies kept on this phone","rpM()")}${mi("doc","Export to CSV","Open in Excel or Sheets","csv()")}${mi("theme","Theme","Currently: "+(C.theme||"auto"),"theme()")}${mi("lock","PIN lock",C.pin?"On":"Off","pinM()")}<input id="f" type="file" accept=".json,application/json" style="display:none" onchange="imp(this)">`)}
function theme(){C.theme=C.theme===""?"light":C.theme==="light"?"dark":"";saveC();applyTheme();menu()}
function pinM(){M(`<h3>PIN lock</h3><small>A 4-digit PIN keeps casual users out. It is not encryption.</small><input id="np" type="password" inputmode="numeric" maxlength="4" placeholder="New 4-digit PIN"><div class="b">${C.pin?`<button class="no" onclick="C.pin='';saveC();M();toast('PIN removed')">Remove PIN</button>`:`<button onclick="M()">Cancel</button>`}<button class="ok" onclick="setPin()">Save PIN</button></div>`)}
function setPin(){var v=$("np").value;if(!/^\d{4}$/.test(v))return toast("Enter 4 digits");C.pin=h(v);saveC();M();toast("PIN set")}
function dl(n,t,y){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:y}));a.download=n;a.click()}catch(e){toast("Download not available here")}}
function csv(){var r=["Date,Person,Phone,Type,Amount,Note"];D.txns.slice().sort((a,c)=>a.date.localeCompare(c.date)).forEach(t=>{var p=P(t.pid)||{name:"",phone:""};r.push([t.date,p.name,p.phone,t.kind==="gave"?"Gave":"Received",t.amt,t.note].map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(","))});dl("khata-"+today()+".csv",r.join("\n"),"text/csv");M()}
function pay(){return JSON.stringify({app:"khata",v:1,t:new Date().toISOString(),parties:D.parties,txns:D.txns})}
function snap(tag){if(!D.parties.length)return;try{var S=JSON.parse(localStorage.getItem("khata_snaps")||"[]");if(!tag&&S.length&&S[0].d===today())return;S.unshift({d:today(),j:JSON.stringify({parties:D.parties,txns:D.txns}),tag:tag||""});localStorage.setItem("khata_snaps",JSON.stringify(S.slice(0,7)))}catch(e){}}
function bkBar(){
  if(!D.parties.length)return `<div class="warn" onclick="$('rf').click()">${ic("hist")}Reinstalled? Tap to restore from a backup file</div><input id="rf" type="file" accept=".json,application/json" style="display:none" onchange="imp(this)">`;
  var s=C.since||0;if(!s&&C.lastBk)return "";var d=C.lastBk?Math.floor((Date.now()-C.lastBk)/864e5):-1,hot=s>=10||d<0||d>=7;
  return `<div class="warn${hot?" hot":""}" onclick="bk()">${ic("upload")}${d<0?"No backup yet":s+" change"+(s===1?"":"s")+" not backed up"+(d>=1?" · last backup "+d+"d ago":"")} · tap to back up</div>`}
function bk(){var t=pay(),n="khata-backup-"+today()+".json",f;try{f=new File([t],n,{type:"application/json"})}catch(e){}
  var done=()=>{C.since=0;C.lastBk=Date.now();saveC();M();render();toast("Backup saved")};
  if(f&&navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:"Khata backup"}).then(done).catch(()=>{});else{dl(n,t,"application/json");done()}}
function exp(){dl("khata-backup-"+today()+".json",pay(),"application/json");C.since=0;C.lastBk=Date.now();saveC();M();render()}
function bkStat(){return C.lastBk?"Last backup "+fd(today(Math.floor((Date.now()-C.lastBk)/864e5)))+" · "+(C.since||0)+" changes since":"No file backup yet"}
function load(d){snap("Before restore");D=d;persist();C.since=0;C.lastBk=Date.now();saveC();M();V.p=null;render();toast("Data restored")}
function imp(i){var f=i.files[0];if(!f)return;var r=new FileReader();r.onload=()=>{try{var d=JSON.parse(r.result);if(!Array.isArray(d.parties)||!Array.isArray(d.txns))throw 0;if(!D.parties.length||confirm("Replace this phone’s data with the backup ("+d.parties.length+" people, "+d.txns.length+" entries)?"))load({parties:d.parties,txns:d.txns})}catch(e){toast("That is not a valid backup file")}};r.readAsText(f);i.value=""}
function rpM(){var S=[];try{S=JSON.parse(localStorage.getItem("khata_snaps")||"[]")}catch(e){}
  M(`<h3>Restore points</h3><small>A copy from the first time you open the app each day (last 7). Use it if you delete something by mistake. They stay on this phone, so they do not replace a file backup.</small>${S.length?S.map((s,i)=>{var d=JSON.parse(s.j);return mi("hist",fd(s.d)+(s.tag?" · "+s.tag:""),d.parties.length+" people, "+d.txns.length+" entries","rp("+i+")")}).join(""):"<small>None yet.</small>"}`)}
function rp(i){var s=JSON.parse(localStorage.getItem("khata_snaps")||"[]")[i];if(s&&confirm("Go back to the data from "+fd(s.d)+"? Your current data is kept as a restore point."))load(JSON.parse(s.j))}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
snap();render();
</script></body></html>
